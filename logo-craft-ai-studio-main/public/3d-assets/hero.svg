<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" rx="20" fill="#FEE2E2"/>

  <!-- 3D Cup -->
  <g transform="translate(150, 200)">
    <!-- Cup Body -->
    <path d="M50 0 L90 150 L190 150 L230 0 Z" fill="#6366F1" />
    <ellipse cx="140" cy="0" rx="90" ry="30" fill="#818CF8" />
    <ellipse cx="140" cy="150" rx="50" ry="20" fill="#4F46E5" />
    <!-- Straw -->
    <path d="M160 -50 L170 -80 L180 -50 Z" fill="#F472B6" />
    <rect x="165" y="-50" width="10" height="50" fill="#F472B6" />
  </g>

  <!-- 3D Cube -->
  <g transform="translate(400, 200)">
    <!-- Front face -->
    <rect x="0" y="0" width="100" height="100" fill="#EC4899" />
    <!-- Top face -->
    <path d="M0 0 L50 -50 L150 -50 L100 0 Z" fill="#F9A8D4" />
    <!-- Right face -->
    <path d="M100 0 L150 -50 L150 50 L100 100 Z" fill="#DB2777" />
    <!-- Logo letter -->
    <text x="30" y="60" font-family="Arial" font-weight="bold" font-size="40" fill="white">A</text>
  </g>

  <!-- 3D Sphere -->
  <g transform="translate(600, 200)">
    <!-- Base circle -->
    <circle cx="0" cy="0" r="80" fill="#2563EB" />
    <!-- Highlight -->
    <circle cx="-20" cy="-20" r="20" fill="#93C5FD" opacity="0.6" />
    <!-- Text -->
    <text x="-45" y="15" font-family="Arial" font-weight="bold" font-size="40" fill="white">XYZ</text>
  </g>
</svg> 